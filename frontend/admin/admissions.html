<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <title>Admissions & Exam Bookings | UKA Admin</title>
  <style>
    .cat-pill { display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border-radius:10px; text-transform:uppercase; margin-bottom:4px; }
    .cat-mock { background:#e0f2fe; color:#0369a1; }
    .cat-exam { background:#fee2e2; color:#b91c1c; }
    .cat-course { background:#dcfce7; color:#15803d; }
  </style>
</head>
<body>
<div class="adm"><aside><a class="brand" href="/" style="padding:10px 12px;margin:4px 0 14px;background:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25)"><img src="/logo.png" width="160" height="33" alt="UKA & British Council" style="height:33px;max-width:160px;object-fit:contain;display:block"><small style="font:800 10px 'Plus Jakarta Sans';color:var(--navy);letter-spacing:.12em;text-transform:uppercase;margin-top:4px">Admin Portal</small></a><nav><a href="/admin/dashboard" class="">Dashboard</a><a href="/admin/courses" class="">Courses</a><a href="/admin/admissions" class="on">Admissions</a><a href="/admin/exam-dates" class="">Exam Dates</a><a href="/admin/messages" class="">Messages</a><a href="/admin/site-content-admin" class="">Site Content & Photos</a><a href="/admin/students" class="">Students</a><a href="/admin/settings" class="">Settings</a></nav><div class="who"><span id="admWhoName">Admin</span><small id="admWhoRole">admin</small><button data-lo>Logout</button></div></aside><main><header><h1>Admissions & Exam/Mock Bookings</h1></header><section id="c"></section></main></div><div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
<script>
(async () => {
  const u = await adminInit('admissions', 'Admissions & Exam/Mock Bookings');
  if (!u) return;
  const isA = u.role === 'admin', c = document.getElementById('c');
  
  const params = new URLSearchParams(location.search);
  let page = 1, st = '', type = params.get('type') || '', q = '', items = [];

  c.innerHTML = `
    <div class="tb" style="gap:12px;flex-wrap:wrap">
      <input type="text" id="sq" placeholder="Search applicant, phone, course..." style="max-width:260px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:13.5px">
      
      <label style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px">
        Category
        <select id="ft" style="padding:7px 10px;border-radius:8px">
          <option value="">All Categories</option>
          <option value="exam"${type === 'exam' ? ' selected' : ''}>IELTS Official Exam Bookings</option>
          <option value="mock"${type === 'mock' ? ' selected' : ''}>Mock Test Bookings</option>
          <option value="course"${type === 'course' ? ' selected' : ''}>Course Admissions</option>
        </select>
      </label>

      <label style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px">
        Status
        <select id="fs" style="padding:7px 10px;border-radius:8px">
          <option value="">All Statuses</option>
          ${STATUS.map(s => `<option value="${s}">${s}</option>`).join('')}
        </select>
      </label>

      <span id="cnt" style="color:var(--mut);margin-left:auto;font-weight:600;font-size:13px">Loading...</span>
    </div>

    <div class="box">
      <table>
        <thead>
          <tr>
            <th style="width:90px">Date</th>
            <th>Applicant</th>
            <th>Target Program / Exam</th>
            <th>Details / Message</th>
            <th>Status</th>
            <th>Internal Note</th>
            ${isA ? '<th style="text-align:right">Action</th>' : ''}
          </tr>
        </thead>
        <tbody id="tb">
          <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--mut)">Loading records...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pg">
      <button class="b" id="pv">← Prev</button>
      <span id="pi"></span>
      <button class="b" id="nx">Next →</button>
    </div>
  `;

  const tb = document.getElementById('tb');
  const cnt = document.getElementById('cnt');
  const pi = document.getElementById('pi');
  const pv = document.getElementById('pv');
  const nx = document.getElementById('nx');
  const sq = document.getElementById('sq');
  const ft = document.getElementById('ft');
  const fs = document.getElementById('fs');

  function getCatPill(title) {
    const t = String(title || '').toLowerCase();
    if (t.includes('exam') || t.includes('official')) {
      return '<span class="cat-pill cat-exam">Official Exam</span>';
    } else if (t.includes('mock')) {
      return '<span class="cat-pill cat-mock">Mock Test</span>';
    } else {
      return '<span class="cat-pill cat-course">Course</span>';
    }
  }

  async function load() {
    try {
      let url = `/admissions?limit=15&page=${page}`;
      if (st) url += `&status=${encodeURIComponent(st)}`;
      if (type) url += `&type=${encodeURIComponent(type)}`;
      if (q) url += `&q=${encodeURIComponent(q)}`;

      const d = await api(url);
      items = d.items || [];
      cnt.textContent = `${d.total} request(s)`;
      pi.textContent = `Page ${d.page} of ${Math.max(1, d.pages)}`;
      pv.disabled = d.page <= 1;
      nx.disabled = d.page >= d.pages;

      if (!items.length) {
        tb.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--mut)">No requests found matching criteria.</td></tr>';
        return;
      }

      tb.innerHTML = items.map((x, i) => `
        <tr>
          <td><small>${fdate(x.createdAt)}</small></td>
          <td>
            <b>${esc(x.name)}</b><br>
            <a href="tel:${esc(x.phone)}" style="color:var(--navy);font-weight:600">${esc(x.phone)}</a><br>
            <small style="color:var(--mut)">${esc(x.email || '')}</small>
          </td>
          <td>
            ${getCatPill(x.courseTitle)}<br>
            <b>${esc(x.courseTitle || 'IELTS Program')}</b>
          </td>
          <td>
            <div style="font-size:12.5px;max-width:280px;white-space:pre-line;line-height:1.45;color:#334155">${esc(x.message || '—')}</div>
          </td>
          <td>
            <select data-s="${i}" style="padding:5px 8px;border-radius:6px;font-size:12px;font-weight:600">
              ${STATUS.map(s => `<option value="${s}"${s === x.status ? ' selected' : ''}>${s}</option>`).join('')}
            </select>
          </td>
          <td>
            <input data-n="${i}" value="${esc(x.note || '')}" placeholder="Add private note" maxlength="1000" style="width:140px;padding:5px 8px;font-size:12px;border:1px solid var(--line);border-radius:6px">
          </td>
          ${isA ? `<td style="text-align:right"><button class="b del" data-d="${i}" style="font-size:11px;padding:5px 10px">Delete</button></td>` : ''}
        </tr>
      `).join('');
    } catch (e) {
      toast(e.message, 1);
    }
  }

  const patch = async (i, body) => {
    try {
      await api('/admissions/' + items[i]._id, { method: 'PATCH', body });
      toast('Updated successfully');
    } catch (e) {
      toast(e.message, 1);
    }
  };

  tb.onchange = e => {
    if (e.target.dataset.s !== undefined) patch(e.target.dataset.s, { status: e.target.value });
    if (e.target.dataset.n !== undefined) patch(e.target.dataset.n, { note: e.target.value });
  };

  tb.onclick = async e => {
    const b = e.target.closest('[data-d]');
    if (!b) return;
    if (!confirm('Permanently delete this applicant record?')) return;
    try {
      await api('/admissions/' + items[b.dataset.d]._id, { method: 'DELETE' });
      toast('Record deleted');
      load();
    } catch (er) {
      toast(er.message, 1);
    }
  };

  let debounceTimer;
  sq.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      q = sq.value.trim();
      page = 1;
      load();
    }, 300);
  });

  ft.onchange = () => {
    type = ft.value;
    page = 1;
    load();
  };

  fs.onchange = () => {
    st = fs.value;
    page = 1;
    load();
  };

  pv.onclick = () => { if (page > 1) { page--; load(); } };
  nx.onclick = () => { page++; load(); };

  load();
})();
</script>
</body>
</html>
