<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/admin.css"><title>Dashboard | UKA Admin</title></head><body>
<div class="adm"><aside><a class="brand" href="/" style="padding:10px 12px;margin:4px 0 14px;background:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25)"><img src="/logo.png" width="160" height="33" alt="UKA & British Council" style="height:33px;max-width:160px;object-fit:contain;display:block"><small style="font:800 10px 'Plus Jakarta Sans';color:var(--navy);letter-spacing:.12em;text-transform:uppercase;margin-top:4px">Admin Portal</small></a><nav><a href="/admin/dashboard" class="on">Dashboard</a><a href="/admin/courses" class="">Courses</a><a href="/admin/admissions" class="">Admissions</a><a href="/admin/exam-dates" class="">Exam Dates</a><a href="/admin/messages" class="">Messages</a><a href="/admin/site-content-admin" class="">Site Content & Photos</a><a href="/admin/students" class="">Students</a><a href="/admin/settings" class="">Settings</a></nav><div class="who"><span id="admWhoName">Admin</span><small id="admWhoRole">admin</small><button data-lo>Logout</button></div></aside><main><header><h1>Admin Overview</h1></header><section id="c"></section></main></div><div id="toast"></div>

<script src="/js/api.js"></script><script src="/js/admin.js"></script>
<script>
(async () => {
  const u = await adminInit('dashboard', 'Admin Overview');
  if (!u) return;

  const c = document.getElementById('c');
  c.innerHTML = `
    <div class="cards" id="stats">
      <div class="stat hot"><b id="s-pending">—</b><span>Pending Admissions</span></div>
      <div class="stat hot"><b id="s-messages">—</b><span>Unread Messages</span></div>
      <div class="stat"><b id="s-students">—</b><span>Total Students</span></div>
      <div class="stat"><b id="s-courses">—</b><span>Active Courses</span></div>
      <div class="stat"><b id="s-week">—</b><span>Joined This Week</span></div>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px">
      <a class="b red" href="/admin/admissions">Review Admissions</a>
      <a class="b" href="/admin/site-content-admin?tab=news">Blog & News Publisher</a>
      <a class="b" href="/admin/exam-dates">Exam Dates & Slots</a>
      <a class="b" href="/admin/courses">Manage Courses</a>
      <a class="b" href="/admin/messages">Contact Messages</a>
      ${u.role === 'admin' ? '<a class="b" href="/admin/site-content-admin">Site Photos & Content</a><a class="b" href="/admin/settings">Site Settings</a>' : ''}
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px">
      <div class="box" style="padding:18px 20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h3 style="font:800 18px 'Bricolage Grotesque';color:var(--navy)">Recent Admissions</h3>
          <a href="/admin/admissions" style="font-weight:700;font-size:13px;color:var(--red)">View all →</a>
        </div>
        <div id="adm-list"><p style="color:var(--mut);font-size:14px">Loading admissions…</p></div>
      </div>

      <div class="box" style="padding:18px 20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h3 style="font:800 18px 'Bricolage Grotesque';color:var(--navy)">Recent Messages</h3>
          <a href="/admin/messages" style="font-weight:700;font-size:13px;color:var(--red)">View all →</a>
        </div>
        <div id="msg-list"><p style="color:var(--mut);font-size:14px">Loading messages…</p></div>
      </div>
    </div>
  `;

  try {
    const s = await api('/admin/stats');
    document.getElementById('s-pending').textContent = s.pendingAdmissions ?? 0;
    document.getElementById('s-messages').textContent = s.unreadMessages ?? 0;
    document.getElementById('s-students').textContent = s.students ?? 0;
    document.getElementById('s-courses').textContent = s.courses ?? 0;
    document.getElementById('s-week').textContent = s.week ?? 0;
  } catch (e) {
    toast(e.message, 1);
  }

  // Load recent 4 admissions
  try {
    const d = await api('/admissions?limit=4&page=1');
    const items = d.items || [];
    const admEl = document.getElementById('adm-list');
    if (!items.length) {
      admEl.innerHTML = '<p style="color:var(--mut);font-size:14px">No admission requests yet.</p>';
    } else {
      admEl.innerHTML = items.map(a => `
        <div style="border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <b>${esc(a.name)}</b> <span class="tag ${a.status === 'pending' ? 'off' : 'on'}" style="font-size:10.5px">${esc(a.status)}</span>
            <div style="font-size:13px;color:var(--mut)">${esc(a.courseTitle || 'IELTS')} &bull; <a href="tel:${esc(a.phone)}" style="color:var(--navy)">${esc(a.phone)}</a></div>
          </div>
          <small style="color:var(--mut)">${fdate(a.createdAt)}</small>
        </div>
      `).join('');
    }
  } catch {}

  // Load recent 4 messages
  try {
    const d = await api('/contact?limit=4&page=1');
    const items = d.items || [];
    const msgEl = document.getElementById('msg-list');
    if (!items.length) {
      msgEl.innerHTML = '<p style="color:var(--mut);font-size:14px">No visitor messages yet.</p>';
    } else {
      msgEl.innerHTML = items.map(m => `
        <div style="border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <b>${esc(m.name)}</b> ${!m.isRead ? '<span class="tag off" style="font-size:10px">NEW</span>' : ''}
            <div style="font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px">${esc(m.subject || m.message || '')}</div>
          </div>
          <small style="color:var(--mut)">${fdate(m.createdAt)}</small>
        </div>
      `).join('');
    }
  } catch {}
})();
</script></body></html>
