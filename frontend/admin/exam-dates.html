<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <title>Official Exam Dates & Slots | UKA Admin</title>
</head>
<body>
<div class="adm"><aside><a class="brand" href="/" style="padding:10px 12px;margin:4px 0 14px;background:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25)"><img src="/logo.png" width="160" height="33" alt="UKA & British Council" style="height:33px;max-width:160px;object-fit:contain;display:block"><small style="font:800 10px 'Plus Jakarta Sans';color:var(--navy);letter-spacing:.12em;text-transform:uppercase;margin-top:4px">Admin Portal</small></a><nav><a href="/admin/dashboard" class="">Dashboard</a><a href="/admin/courses" class="">Courses</a><a href="/admin/admissions" class="">Admissions</a><a href="/admin/exam-dates" class="on">Exam Dates</a><a href="/admin/messages" class="">Messages</a><a href="/admin/site-content-admin" class="">Site Content & Photos</a><a href="/admin/students" class="">Students</a><a href="/admin/settings" class="">Settings</a></nav><div class="who"><span id="admWhoName">Admin</span><small id="admWhoRole">admin</small><button data-lo>Logout</button></div></aside><main><header><h1>Official Exam Dates & Slots</h1></header><section id="c"></section></main></div><div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
<script>
(async () => {
  const u = await adminInit('exam-dates', 'Official Exam Dates & Slots', true);
  if (!u) return;
  const c = document.getElementById('c');
  let list = [], editId = null;

  c.innerHTML = `
    <div class="tb">
      <b style="font-size:18px">Computer-Delivered Exam Dates & Slots</b>
      <button class="b red" id="ad" style="margin-left:auto">+ Add Exam Date</button>
    </div>
    <div class="box">
      <table>
        <thead>
          <tr>
            <th>Exam Date</th>
            <th>Test Module</th>
            <th>Slot Timing</th>
            <th>Mode</th>
            <th>Seats</th>
            <th>Fee</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="td"></tbody>
      </table>
    </div>

    <div class="tb" style="margin-top:28px">
      <b style="font-size:18px">Official Fee Schedule</b>
      <button class="b red" id="af" style="margin-left:auto">+ Add Fee</button>
    </div>
    <div class="box">
      <table>
        <thead>
          <tr>
            <th>Test Module</th>
            <th>Official Fee</th>
            <th>Note</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tf"></tbody>
      </table>
    </div>

    <dialog id="dg">
      <div class="dialog-head">
        <h2 id="dt"></h2>
        <button type="button" class="dialog-close-btn" onclick="document.getElementById('dg').close()" title="Close">×</button>
      </div>
      <form id="fm">
        <input type="hidden" name="kind">
        <div class="cols">
          <label class="f">Test Module
            <select name="testType" required>
              <option value="IELTS Academic">IELTS Academic</option>
              <option value="IELTS General Training">IELTS General Training</option>
            </select>
          </label>
          <label class="f">Official Fee (৳)
            <input name="fee" type="number" min="0" value="24000">
          </label>
          <label class="f d">Exam Date
            <input name="examDate" type="date">
          </label>
          <label class="f d">Registration Deadline
            <input name="deadline" type="date">
          </label>
          <label class="f d">Testing Slot
            <select name="slot">
              <option value="Morning Slot (LRW 9:00 AM - 11:45 AM | Speaking 1:20 PM)">Morning Slot (LRW 9:00 AM – 11:45 AM | Speaking 1:20 PM)</option>
              <option value="Day Slot (Speaking 9:00 AM | LRW 1:00 PM - 3:45 PM)">Day Slot (Speaking 9:00 AM | LRW 1:00 PM – 3:45 PM)</option>
            </select>
          </label>
          <label class="f d">Delivery Mode
            <select name="mode">
              <option value="Computer-delivered" selected>Computer-delivered (Official Lab)</option>
              <option value="Paper-based">Paper-based</option>
            </select>
          </label>
          <label class="f d">Venue
            <input name="venue" maxlength="150" value="UKA British Council Computer Lab">
          </label>
          <label class="f d">Total Seats (Max 10)
            <input name="seats" type="number" min="1" max="100" value="10">
          </label>
          <label class="f">Display Order
            <input name="order" type="number" value="0">
          </label>
        </div>
        <label class="f">Perks / Notes (Visible to Candidates)
          <input name="note" maxlength="300" placeholder="e.g. 5 Free Mocks + 1 Month Free Lab Practice Included">
        </label>
        <label class="f">
          <input type="checkbox" name="isActive" checked> Show on website calendar
        </label>
        <div class="tb">
          <button class="b red" id="sv">Save Slot</button>
          <button type="button" class="b" id="cn">Cancel</button>
        </div>
      </form>
    </dialog>
  `;

  const $ = id => document.getElementById(id), dg = $('dg'), fm = $('fm');
  const ymd = v => v ? String(v).slice(0, 10) : '';
  const fd = v => v ? new Date(v).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }) : '—';
  const today = new Date(new Date().toDateString());
  const btn = x => `<button class="b" data-e="${x._id}">Edit</button> <button class="b del" data-d="${x._id}">Delete</button>`;
  const st = x => {
    const past = x.kind == 'date' && new Date(x.examDate) < today;
    return `<span class="tag ${x.isActive && !past ? 'on' : 'off'}">${past ? 'Past' : x.isActive ? 'Active' : 'Hidden'}</span>`;
  };

  const draw = () => {
    const D = list.filter(x => x.kind == 'date'), F = list.filter(x => x.kind == 'fee');
    $('td').innerHTML = D.map(x => `
      <tr>
        <td><b>${fd(x.examDate)}</b></td>
        <td><b>${esc(x.testType)}</b></td>
        <td><span class="tag ${String(x.slot).includes('Morning') ? 'on' : 'off'}">${esc(x.slot || 'Morning Slot')}</span></td>
        <td>${esc(x.mode || 'Computer-delivered')}</td>
        <td><b>${x.seats ?? 10}</b></td>
        <td>${taka(x.fee)}</td>
        <td>${st(x)}</td>
        <td>${btn(x)}</td>
      </tr>
    `).join('') || '<tr><td colspan="8">No exam dates scheduled yet.</td></tr>';

    $('tf').innerHTML = F.map(x => `
      <tr>
        <td><b>${esc(x.testType)}</b></td>
        <td>${taka(x.fee)}</td>
        <td>${esc(x.note || '—')}</td>
        <td>${st(x)}</td>
        <td>${btn(x)}</td>
      </tr>
    `).join('') || '<tr><td colspan="5">No fee rows set yet.</td></tr>';
  };

  const load = async () => {
    try {
      list = await api('/exam-dates/admin/all');
      draw();
    } catch (e) {
      toast(e.message, 1);
    }
  };

  const open = (k, x) => {
    editId = x ? x._id : null;
    fm.reset();
    fm.kind.value = k;
    $('dt').textContent = (x ? 'Edit ' : 'Add ') + (k == 'date' ? 'Exam Slot' : 'Fee Row');
    document.querySelectorAll('.d').forEach(e => e.style.display = k == 'date' ? '' : 'none');
    fm.examDate.required = (k == 'date');

    if (x) {
      for (const f of ['testType', 'fee', 'slot', 'mode', 'venue', 'seats', 'order', 'note']) {
        if (fm[f]) fm[f].value = x[f] ?? '';
      }
      fm.examDate.value = ymd(x.examDate);
      fm.deadline.value = ymd(x.deadline);
      fm.isActive.checked = !!x.isActive;
    } else {
      if (fm.seats) fm.seats.value = 10;
      if (fm.mode) fm.mode.value = 'Computer-delivered';
      if (fm.fee) fm.fee.value = 24000;
      if (fm.venue) fm.venue.value = 'UKA British Council Computer Lab';
      if (fm.note) fm.note.value = '5 Free Mocks + 1 Month Free Lab Practice Included';
    }
    dg.showModal();
  };

  $('ad').onclick = () => open('date');
  $('af').onclick = () => open('fee');
  $('cn').onclick = () => dg.close();

  c.onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.e) {
      const x = list.find(i => i._id == b.dataset.e);
      return open(x.kind, x);
    }
    if (b.dataset.d) {
      if (!confirm('Are you sure you want to delete this row?')) return;
      try {
        await api('/exam-dates/' + b.dataset.d, { method: 'DELETE' });
        toast('Deleted successfully');
        load();
      } catch (er) {
        toast(er.message, 1);
      }
    }
  };

  fm.onsubmit = async e => {
    e.preventDefault();
    const k = fm.kind.value;
    const b = {
      kind: k,
      testType: fm.testType.value.trim(),
      fee: +fm.fee.value || 0,
      order: +fm.order.value || 0,
      note: fm.note.value.trim(),
      isActive: fm.isActive.checked
    };
    if (k == 'date') {
      b.examDate = fm.examDate.value;
      b.deadline = fm.deadline.value;
      b.slot = fm.slot.value;
      b.mode = fm.mode.value;
      b.venue = fm.venue.value.trim();
      b.seats = fm.seats.value === '' ? 10 : +fm.seats.value;
    }

    $('sv').disabled = true;
    try {
      await api(editId ? '/exam-dates/' + editId : '/exam-dates', {
        method: editId ? 'PUT' : 'POST',
        body: b
      });
      dg.close();
      toast('Saved successfully');
      load();
    } catch (er) {
      toast(er.message, 1);
    }
    $('sv').disabled = false;
  };

  load();
})();
</script>
</body>
</html>
