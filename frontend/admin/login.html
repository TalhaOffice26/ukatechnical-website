<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Admin Portal Login | UKA Technical Institute</title>
  <meta name="robots" content="noindex,nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--night:#050c28;--navy:#0b2a6f;--red:#e11d3a;--red2:#ff4d62;--line:#e1e7f6;--ink:#0d1530;--mut:#5d6788;--e:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:'Plus Jakarta Sans',sans-serif}
    body{background:radial-gradient(900px 500px at 80% 0,rgba(225,29,58,.35),transparent 60%),radial-gradient(900px 600px at 0 100%,rgba(11,42,111,.65),transparent 70%),linear-gradient(135deg,var(--night),var(--navy));color:#fff;display:grid;place-items:center;padding:24px}
    
    .login-box{width:100%;max-width:440px;background:#fff;color:var(--ink);border-radius:28px;padding:clamp(28px,5vw,42px);box-shadow:0 35px 80px rgba(0,0,0,.45);border-top:5px solid var(--navy);position:relative}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;font-weight:700;font-size:13px;margin-bottom:20px;transition:color .2s}
    .back-link:hover{color:var(--red)}
    
    .brand-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .brand-wrap img{height:42px;max-width:210px;object-fit:contain}
    .badge-admin{background:#e0e7ff;color:#3730a3;font:800 11px 'Plus Jakarta Sans';text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:20px}
    
    h1{font:800 28px/1.15 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;color:var(--navy);margin-bottom:8px}
    p.sub{color:var(--mut);font-size:14px;line-height:1.55;margin-bottom:24px}
    
    label{display:block;font-weight:700;font-size:13px;color:var(--navy);margin-bottom:16px}
    .field{position:relative;display:block;margin-top:6px}
    input{width:100%;padding:13px 16px;border:2px solid var(--line);border-radius:14px;background:#f8faff;font:inherit;font-size:14.5px;color:var(--ink);transition:all .25s var(--e)}
    input:focus{outline:0;border-color:var(--navy);background:#fff;box-shadow:0 0 0 4px rgba(11,42,111,.12)}
    
    .pw-wrap input{padding-right:48px}
    .eye-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
    .eye-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
    
    .err-box{background:#fff0f2;border:1px solid #ffc7d0;color:#b3112b;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:16px;display:none}
    
    .btn-submit{width:100%;padding:14px 24px;border:0;border-radius:50px;background:linear-gradient(135deg,var(--navy),#1642a8);color:#fff;font:700 15px 'Plus Jakarta Sans';cursor:pointer;box-shadow:0 12px 28px rgba(11,42,111,.35);transition:all .25s var(--e);margin-top:8px}
    .btn-submit:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(11,42,111,.45)}
    .btn-submit:disabled{opacity:.7;cursor:wait}
    
    .sec-notice{text-align:center;font-size:12px;color:var(--mut);margin-top:22px;line-height:1.5}
  </style>
</head>
<body>
  <div class="login-box">
    <a class="back-link" href="/">← Return to Public Website</a>
    <div class="brand-wrap">
      <img src="/logo.png" alt="UKA Technical Institute">
      <span class="badge-admin">Staff Console</span>
    </div>
    <h1>Administrator Login</h1>
    <p class="sub">Sign in with authorized administrative credentials to manage center admissions, exams, and content.</p>

    <div class="err-box" id="errBox" role="alert"></div>

    <form id="loginForm" novalidate>
      <label>
        Admin Email Address
        <span class="field">
          <input type="email" name="email" id="email" autocomplete="email" required placeholder="ukatechnicalbd@gmail.com">
        </span>
      </label>

      <label>
        Password
        <span class="field pw-wrap">
          <input type="password" name="password" id="password" autocomplete="current-password" required placeholder="••••••••">
          <button type="button" class="eye-btn" id="eyeBtn" aria-label="Toggle password visibility">
            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </span>
      </label>

      <button type="submit" class="btn-submit" id="submitBtn">Access Control Panel →</button>
    </form>

    <div class="sec-notice">
      Protected administrative area. All access attempts and activities are securely audited.
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const f = document.getElementById('loginForm');
    const err = document.getElementById('errBox');
    const b = document.getElementById('submitBtn');
    const pw = document.getElementById('password');
    const eye = document.getElementById('eyeBtn');

    eye.onclick = () => {
      const isPw = pw.type === 'password';
      pw.type = isPw ? 'text' : 'password';
      eye.style.color = isPw ? 'var(--navy)' : 'var(--mut)';
    };

    f.onsubmit = async e => {
      e.preventDefault();
      err.style.display = 'none';
      err.textContent = '';

      const email = f.email.value.trim();
      const password = f.password.value;
      if (!email || !password) {
        err.textContent = 'Please enter both admin email and password.';
        err.style.display = 'block';
        return;
      }

      b.disabled = true;
      b.textContent = 'Verifying security credentials…';

      try {
        const res = await api('/auth/login', {
          method: 'POST',
          body: { email, password }
        });

        if (!res.user || res.user.role !== 'admin') {
          throw new Error('Access denied. This account does not possess administrator privileges.');
        }

        try { localStorage.setItem('uka_user', JSON.stringify(res.user)); } catch (x) {}
        b.textContent = 'Credentials verified! Redirecting…';
        location.href = '/admin/dashboard';
      } catch (x) {
        err.textContent = x.message || 'Authentication failed. Please check credentials.';
        err.style.display = 'block';
        b.disabled = false;
        b.textContent = 'Access Control Panel →';
      }
    };
  </script>
</body>
</html>
