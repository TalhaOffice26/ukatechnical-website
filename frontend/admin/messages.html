<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <title>Messages | UKA Admin</title>
</head>
<body>
<div class="adm"><aside><a class="brand" href="/" style="padding:10px 12px;margin:4px 0 14px;background:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25)"><img src="/logo.png" width="160" height="33" alt="UKA & British Council" style="height:33px;max-width:160px;object-fit:contain;display:block"><small style="font:800 10px 'Plus Jakarta Sans';color:var(--navy);letter-spacing:.12em;text-transform:uppercase;margin-top:4px">Admin Portal</small></a><nav><a href="/admin/dashboard" class="">Dashboard</a><a href="/admin/courses" class="">Courses</a><a href="/admin/admissions" class="">Admissions</a><a href="/admin/exam-dates" class="">Exam Dates</a><a href="/admin/messages" class="on">Messages</a><a href="/admin/site-content-admin" class="">Site Content & Photos</a><a href="/admin/students" class="">Students</a><a href="/admin/settings" class="">Settings</a></nav><div class="who"><span id="admWhoName">Admin</span><small id="admWhoRole">admin</small><button data-lo>Logout</button></div></aside><main><header><h1>Visitor Contact Messages</h1></header><section id="c"></section></main></div><div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
<script>
(async () => {
  const u = await adminInit('messages', 'Visitor Contact Messages', false);
  if (!u) return;
  const isA = u.role === 'admin';
  const c = document.getElementById('c');
  let page = 1, items = [];

  c.innerHTML = `
    <div class="tb">
      <span id="cnt" style="color:var(--mut);font-weight:600">Loading messages...</span>
    </div>
    <div class="box">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Sender</th>
            <th>Subject</th>
            <th>Message</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tb">
          <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--mut)">Loading contact messages...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pg">
      <button class="b" id="pv">← Prev</button>
      <span id="pi"></span>
      <button class="b" id="nx">Next →</button>
    </div>
  `;

  const tb = document.getElementById('tb');
  const cnt = document.getElementById('cnt');
  const pi = document.getElementById('pi');
  const pv = document.getElementById('pv');
  const nx = document.getElementById('nx');

  async function load() {
    try {
      const d = await api('/contact?limit=15&page=' + page);
      items = d.items || [];
      cnt.textContent = `${d.total} message(s)`;
      pi.textContent = `Page ${d.page} of ${Math.max(1, d.pages)}`;
      pv.disabled = d.page <= 1;
      nx.disabled = d.page >= d.pages;

      if (!items.length) {
        tb.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--mut)">No messages found.</td></tr>';
        return;
      }

      tb.innerHTML = items.map((m, i) => `
        <tr style="${!m.isRead ? 'background:#fff9fa;font-weight:600' : ''}">
          <td><small>${fdate(m.createdAt)}</small></td>
          <td>
            <b>${esc(m.name)}</b><br>
            ${m.phone ? `<a href="tel:${esc(m.phone)}" style="color:var(--navy)">${esc(m.phone)}</a><br>` : ''}
            ${m.email ? `<a href="mailto:${esc(m.email)}" style="color:var(--mut);font-size:13px">${esc(m.email)}</a>` : ''}
          </td>
          <td><b>${esc(m.subject || 'General Enquiry')}</b></td>
          <td><div style="max-width:340px;font-size:14px;white-space:pre-line;line-height:1.5">${esc(m.message)}</div></td>
          <td>
            <button class="b" data-r="${i}" style="font-size:12px;padding:6px 12px">
              ${m.isRead ? 'Mark Unread' : 'Mark as Read'}
            </button>
          </td>
          <td>
            ${isA ? `<button class="b del" data-d="${m._id}">Delete</button>` : ''}
          </td>
        </tr>
      `).join('');
    } catch (e) {
      toast(e.message, 1);
    }
  }

  tb.onclick = async e => {
    const btnR = e.target.closest('[data-r]');
    if (btnR) {
      const idx = btnR.dataset.r;
      const m = items[idx];
      try {
        await api('/contact/' + m._id, {
          method: 'PATCH',
          body: { isRead: !m.isRead }
        });
        toast('Message status updated');
        load();
      } catch (err) {
        toast(err.message, 1);
      }
      return;
    }

    const btnD = e.target.closest('[data-d]');
    if (btnD) {
      const id = btnD.dataset.d;
      if (!confirm('Are you sure you want to delete this message?')) return;
      try {
        await api('/contact/' + id, { method: 'DELETE' });
        toast('Message deleted');
        load();
      } catch (err) {
        toast(err.message, 1);
      }
    }
  };

  pv.onclick = () => { page--; load(); };
  nx.onclick = () => { page++; load(); };

  load();
})();
</script>
</body>
</html>
