              </span>
              <small style="color:var(--mut);display:block;margin-bottom:6px">1 MOCK 750TK, 2 MOCK 1400TK, 5 MOCK 3000TK, 10 MOCK 5000TK</small>
              <textarea name="mockPackages" rows="6" style="font-family:monospace;font-size:13px"></textarea>
            </label>
          </div>

          <div>
            <label class="f">
              <span style="font-size:14.5px;font-weight:700;color:var(--navy)">
                ⭐ Official Mock Test Advantages (One feature per line)
                <span class="page-indicator-pill green">Appears on: mock-test.html</span>
              </span>
              <textarea name="mockFeatures" rows="5" placeholder="Real exam environment&#10;Exam in main exam center&#10;Result in 24 hour&#10;Feedback&#10;Exam in real exam server"></textarea>
            </label>
          </div>
        </div>
      </div>

      <!-- TAB 5: COUNTERS & PAGE TEXTS -->
      <div class="setting-section" id="tab-counters">
        <div class="box" style="padding:28px">
          <div style="margin-bottom:20px">
            <h3 style="margin:0 0 4px;font-size:20px;color:var(--navy)">5. Live Statistics Counters & Dynamic Public Texts</h3>
            <p style="color:var(--mut);font-size:13.5px;margin:0">
              Numbers displayed across the homepage counter ribbon, and institutional overview text.
            </p>
          </div>

          <div style="background:#f8faff;border:1.5px solid #dce4f2;border-radius:18px;padding:20px;margin-bottom:22px">
            <b style="font-size:14.5px;color:var(--navy);display:block;margin-bottom:10px">
              Homepage Live Statistics Counters
              <span class="page-indicator-pill">Appears on: index.html</span>
            </b>
            <div class="cols">
              <label class="f">Students Trained
                <input name="students" type="number" min="0">
              </label>
              <label class="f">Satisfaction %
                <input name="satisfaction" type="number" min="0" max="100">
              </label>
              <label class="f">Expert Teachers
                <input name="teachers" type="number" min="0">
              </label>
              <label class="f">Branches Count
                <input name="branches" type="number" min="0">
              </label>
            </div>
          </div>

          <label class="f">
            About Us Summary Text
            <span class="page-indicator-pill">Appears on: about.html</span>
            <textarea name="about" rows="3" placeholder="About UKA Technical Institute overview..."></textarea>
          </label>

          <label class="f">
            Our Story Text
            <span class="page-indicator-pill">Appears on: our-story.html</span>
            <textarea name="story" rows="3" placeholder="The founding story and journey..."></textarea>
          </label>

          <label class="f">
            Privacy Policy & Candidate Data Terms
            <span class="page-indicator-pill">Appears on: privacy.html</span>
            <textarea name="privacy" rows="4" placeholder="Candidate data protection policy..."></textarea>
          </label>
        </div>
      </div>

      <!-- Sticky Save Bar -->
      <div class="settings-bottom-bar">
        <div>
          <b style="color:var(--navy);font-size:15px;display:block">Save Changes</b>
          <small style="color:var(--mut)">Saves all configuration, photos & text across all tabs.</small>
        </div>
        <button class="b red" id="sv" style="padding:14px 34px;font-size:15px;font-weight:700">Save All Settings</button>
      </div>
    </form>
  `;

  // Tab switching logic
  const tabBtns = document.querySelectorAll('#settingTabs button');
  const sections = document.querySelectorAll('.setting-section');
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      sections.forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      const targetSec = document.getElementById(btn.dataset.sec);
      if (targetSec) targetSec.classList.add('active');
    });
  });

  const f = document.getElementById('f');
  const updatePrev = (boxId, url) => {
    const el = document.getElementById(boxId);
    if (!el) return;
    if (url && url.trim()) {
      el.innerHTML = `<img src="${esc(url.trim())}" alt="Preview" onerror="this.src='';this.alt='Invalid URL'">`;
    } else {
      el.innerHTML = '<span style="font-size:11px;color:#64748b">No Preview</span>';
    }
  };

  // Preview listeners
  document.getElementById('heroShowcaseUrl').addEventListener('input', e => updatePrev('heroShowcasePrev', e.target.value));
  document.getElementById('venueUrl').addEventListener('input', e => updatePrev('venuePrev', e.target.value));
  document.getElementById('academicUrl').addEventListener('input', e => updatePrev('academicPrev', e.target.value));
  document.getElementById('generalUrl').addEventListener('input', e => updatePrev('generalPrev', e.target.value));
  document.getElementById('buildingUrl').addEventListener('input', e => updatePrev('buildingPrev', e.target.value));
  document.getElementById('chairmanUrl').addEventListener('input', e => updatePrev('chairmanPrev', e.target.value));
  document.getElementById('schoolUrl1').addEventListener('input', e => updatePrev('schoolPrev1', e.target.value));
  document.getElementById('schoolUrl2').addEventListener('input', e => updatePrev('schoolPrev2', e.target.value));
  document.getElementById('schoolUrl3').addEventListener('input', e => updatePrev('schoolPrev3', e.target.value));

  // File upload handler
  document.querySelectorAll('input[type="file"][data-target]').forEach(input => {
    input.addEventListener('change', async () => {
      const file = input.files[0];
      if (!file) return;
      const targetId = input.dataset.target;
      const prevId = input.dataset.prev;
      const targetInp = document.getElementById(targetId);
      
      const fd = new FormData();
      fd.append('image', file);

      try {
        toast('Uploading photo...');
        const r = await fetch('/api/upload', {
          method: 'POST',
          credentials: 'same-origin',
          body: fd
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Upload failed');
        if (targetInp) {
          targetInp.value = d.url;
          updatePrev(prevId, d.url);
        }
        toast('Photo uploaded successfully!');
      } catch (err) {
        toast(err.message, 1);
      }
    });
  });

  // Load existing settings
  try {
    const s = await api('/settings');
    for (const k in s) {
      if (f[k]) f[k].value = s[k] ?? '';
    }
    updatePrev('heroShowcasePrev', s.heroShowcasePhoto || '/images/british-council-meet.png');
    updatePrev('venuePrev', s.ieltsVenuePhoto);
    updatePrev('academicPrev', s.ieltsAcademicPhoto);
    updatePrev('generalPrev', s.ieltsGeneralPhoto);
    updatePrev('buildingPrev', s.branchBuildingPhoto);
    updatePrev('chairmanPrev', s.chairmanPhoto);
    updatePrev('schoolPrev1', s.schoolPhoto1);
    updatePrev('schoolPrev2', s.schoolPhoto2);
    updatePrev('schoolPrev3', s.schoolPhoto3);
  } catch (e) {
    toast(e.message, 1);
  }

  // Submit form
  f.onsubmit = async e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(f));
    for (const k of ['students', 'satisfaction', 'teachers', 'branches']) {
      v[k] = +v[k] || 0;
    }
    v.whatsapp = String(v.whatsapp).replace(/\D/g, '');

    document.getElementById('sv').disabled = true;
    document.getElementById('sv').textContent = 'Saving...';
    try {
      await api('/settings', { method: 'PUT', body: v });
      toast('All settings and photos saved successfully!');
    } catch (er) {
      toast(er.message, 1);
    }
    document.getElementById('sv').disabled = false;
    document.getElementById('sv').textContent = 'Save All Settings';
  };
})();
</script>
</body>
</html>
