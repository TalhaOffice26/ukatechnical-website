<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <title>Students & Users | UKA Admin</title>
</head>
<body>
<div class="adm"><aside><a class="brand" href="/" style="padding:10px 12px;margin:4px 0 14px;background:#fff;border-radius:14px;display:flex;flex-direction:column;align-items:center;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25)"><img src="/logo.png" width="160" height="33" alt="UKA & British Council" style="height:33px;max-width:160px;object-fit:contain;display:block"><small style="font:800 10px 'Plus Jakarta Sans';color:var(--navy);letter-spacing:.12em;text-transform:uppercase;margin-top:4px">Admin Portal</small></a><nav><a href="/admin/dashboard" class="">Dashboard</a><a href="/admin/courses" class="">Courses</a><a href="/admin/admissions" class="">Admissions</a><a href="/admin/exam-dates" class="">Exam Dates</a><a href="/admin/messages" class="">Messages</a><a href="/admin/site-content-admin" class="">Site Content & Photos</a><a href="/admin/students" class="on">Students</a><a href="/admin/settings" class="">Settings</a></nav><div class="who"><span id="admWhoName">Admin</span><small id="admWhoRole">admin</small><button data-lo>Logout</button></div></aside><main><header><h1>Registered Students & Users</h1></header><section id="c"></section></main></div><div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/admin.js"></script>
<script>
(async () => {
  const u = await adminInit('students', 'Registered Students & Users', true);
  if (!u) return;
  const c = document.getElementById('c');

  c.innerHTML = `
    <div class="tb">
      <input type="text" id="sq" placeholder="Search by name, email, or phone..." style="max-width:320px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit">
      <span id="scnt" style="color:var(--mut);margin-left:auto;font-weight:600">Loading students...</span>
    </div>

    <div class="box">
      <table>
        <thead>
          <tr>
            <th>Joined</th>
            <th>Student Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tb">
          <tr><td colspan="7" style="text-align:center;padding:40px;color:var(--mut)">Loading user accounts...</td></tr>
        </tbody>
      </table>
    </div>
  `;

  const tb = document.getElementById('tb');
  const sq = document.getElementById('sq');
  const scnt = document.getElementById('scnt');
  let users = [];

  async function load(q = '') {
    try {
      const url = '/admin/users' + (q ? '?q=' + encodeURIComponent(q) : '');
      const d = await api(url);
      users = d.users || [];
      scnt.textContent = `${users.length} registered user(s)`;
      render();
    } catch (e) {
      toast(e.message, 1);
      tb.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--red)">${esc(e.message)}</td></tr>`;
    }
  }

  function render() {
    if (!users.length) {
      tb.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--mut)">No users found.</td></tr>';
      return;
    }

    tb.innerHTML = users.map((x, i) => {
      const isSelf = String(x._id) === String(u.id);
      return `
        <tr>
          <td><small>${fdate(x.createdAt)}</small></td>
          <td><b>${esc(x.name)}</b>${isSelf ? ' <small style="color:var(--red)">(You)</small>' : ''}</td>
          <td>${esc(x.email)}</td>
          <td>${esc(x.phone || '—')}</td>
          <td>
            <select data-r="${x._id}" ${isSelf ? 'disabled' : ''} style="padding:6px 10px;border-radius:8px">
              <option value="student"${x.role === 'student' ? ' selected' : ''}>Student</option>
              <option value="admin"${x.role === 'admin' ? ' selected' : ''}>Admin</option>
            </select>
          </td>
          <td>
            <select data-a="${x._id}" ${isSelf ? 'disabled' : ''} style="padding:6px 10px;border-radius:8px">
              <option value="1"${x.active !== false ? ' selected' : ''}>Active</option>
              <option value="0"${x.active === false ? ' selected' : ''}>Disabled</option>
            </select>
          </td>
          <td>
            ${isSelf ? '<small style="color:var(--mut)">Current session</small>' : `<button class="b del" data-d="${x._id}">Delete</button>`}
          </td>
        </tr>
      `;
    }).join('');
  }

  let debounceTimer;
  sq.addEventListener('input', e => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => load(e.target.value.trim()), 300);
  });

  tb.onchange = async e => {
    const idRole = e.target.dataset.r;
    if (idRole) {
      try {
        await api('/admin/users/' + idRole, {
          method: 'PATCH',
          body: { role: e.target.value }
        });
        toast('User role updated');
      } catch (err) {
        toast(err.message, 1);
        load(sq.value.trim());
      }
    }

    const idActive = e.target.dataset.a;
    if (idActive) {
      try {
        await api('/admin/users/' + idActive, {
          method: 'PATCH',
          body: { active: e.target.value === '1' }
        });
        toast('Account status updated');
      } catch (err) {
        toast(err.message, 1);
        load(sq.value.trim());
      }
    }
  };

  tb.onclick = async e => {
    const btn = e.target.closest('[data-d]');
    if (!btn) return;
    const id = btn.dataset.d;
    if (!confirm('Are you sure you want to delete this user account? This cannot be undone.')) return;
    try {
      await api('/admin/users/' + id, { method: 'DELETE' });
      toast('User deleted');
      load(sq.value.trim());
    } catch (err) {
      toast(err.message, 1);
    }
  };

  load();
})();
</script>
</body>
</html>
